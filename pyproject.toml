[project]
name = "postproject-openassetio-validation"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "openassetio>=1.0.2,<2",
  "openassetio-mediacreation>=1.0.0a13,<2",
  "postproject>=0.3.0a1,<0.4",
]

[project.entry-points."openassetio.manager_plugin"]
postproject-validation = "postproject_oaio_spike"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
